name: Publish Packages

env:
  CI: true

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'Distribution Tag'
        type: choice
        options:
          - 'alpha'
          - 'beta'
          - 'rc'
          - 'next'
          - 'latest'
        required: true
        default: 'alpha'
      target_branch:
        description: 'Branch to publish from'
        type: choice
        options:
          - 'next'
          - 'main'
        required: true
        default: 'next'

permissions:
  contents: read
  id-token: write

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22.x

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Hard gate: fail before publish if any catalog:/workspace: specifier
      # would ship verbatim (lerna's blind spot; pnpm publish resolves them).
      - name: Check packed specifiers
        run: pnpm check:packed

      - name: Capture versions for report
        run: |
          echo "## Publishing to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Dist Tag:** \`${{ github.event.inputs.dist_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.event.inputs.target_branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npx lerna ls --json | jq -r '.[] | "- **\(.name)** -> `v\(.version)`"' >> $GITHUB_STEP_SUMMARY

      # pnpm (NOT lerna) does the publish: it natively rewrites catalog: and
      # workspace: to concrete ranges, and supports OIDC provenance.
      - name: Publish
        run: pnpm -r --filter './packages/**' publish --tag ${{ github.event.inputs.dist_tag }} --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
