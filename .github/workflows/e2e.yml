name: E2E Tests

env:
  CI: true

on:
  pull_request:
    branches:
      - main
      - next
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run e2e from'
        required: true
        type: string
        default: 'next'

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22.x

jobs:
  e2e:
    name: Subscription Service E2E (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.target_branch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CRITICAL: the OTEL bootstrap travels as a Docker image so its runtime
      # dependencies are real files inside the container filesystem.
      - name: Build OTEL bootstrap image
        run: pnpm build:otel-image

      # e2e consumes @earsyntax/blackbox through its dist exports map.
      - name: Build
        run: pnpm build

      - name: Run system e2e
        run: pnpm test:system

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-coverage
          path: e2e/.blackbox-coverage/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.playwright-report/
          if-no-files-found: ignore
